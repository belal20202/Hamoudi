<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="55%" stop-color="#5a2a6a"/>
      <stop offset="100%" stop-color="#c9752f"/>
    </linearGradient>
    <linearGradient id="domeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2550"/>
      <stop offset="100%" stop-color="#201636"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd76b"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>

  <!-- warm glow behind the hero -->
  <circle cx="256" cy="220" r="185" fill="url(#glow)"/>

  <!-- moon -->
  <circle cx="388" cy="88" r="32" fill="#ffe9a8" opacity="0.9"/>

  <!-- distant palace: two side minarets with real onion domes + a low
       central archway (kept well below the hero so nothing overlaps) -->
  <g fill="url(#domeShade)">
    <!-- ground band -->
    <rect x="0" y="418" width="512" height="94"/>

    <!-- left minaret -->
    <rect x="66" y="330" width="52" height="88"/>
    <path d="M60 330 Q60 280 92 262 Q124 280 124 330 Z"/>
    <rect x="88" y="240" width="8" height="24"/>
    <circle cx="92" cy="236" r="5"/>

    <!-- right minaret -->
    <rect x="394" y="330" width="52" height="88"/>
    <path d="M388 330 Q388 280 420 262 Q452 280 452 330 Z"/>
    <rect x="416" y="240" width="8" height="24"/>
    <circle cx="420" cy="236" r="5"/>
  </g>

  <!-- HERO: matches the actual in-game character construction exactly
       (see TextureFactory.playerFrame's "idle" pose); white ghutra +
       black agal band, gold vest, red sash, tan skin; not a generic
       "Arabian hero" stand-in. Fine facial linework is intentionally
       skipped here (unlike the in-game sprite) since it would vanish
       entirely once this is downscaled to a 48px launcher icon; the bold
       color-blocked silhouette is what actually needs to read at that size. -->
  <g transform="translate(256,300)">
    <!-- legs -->
    <path d="M-22 62 L-34 118 L-12 118 L2 66 Z" fill="#241a38"/>
    <path d="M18 62 L28 118 L52 118 L34 62 Z" fill="#241a38"/>
    <!-- shoes -->
    <path d="M-38 112 L-10 112 L-10 126 L-42 126 Z" fill="#1a1730"/>
    <path d="M26 112 L54 112 L58 126 L26 126 Z" fill="#1a1730"/>

    <!-- torso / vest -->
    <path d="M-34 -22 Q-34 -58 0 -58 Q34 -58 34 -22 L34 46 Q0 60 -34 46 Z" fill="url(#vest)"/>
    <!-- vest shading, darker side (matches the in-game fake-3D fold) -->
    <path d="M2 -58 Q34 -58 34 -22 L34 46 Q17 53 2 46 Z" fill="#c98a12" opacity="0.55"/>
    <!-- sash -->
    <rect x="-34" y="-2" width="68" height="16" fill="#cf4b3c"/>

    <!-- arms -->
    <path d="M-34 -30 Q-52 -18 -56 20 L-38 22 Q-34 -4 -18 -18 Z" fill="#e0ac69"/>
    <path d="M34 -30 Q52 -18 56 20 L38 22 Q34 -4 18 -18 Z" fill="#e0ac69"/>

    <!-- neck + head -->
    <rect x="-11" y="-68" width="22" height="20" fill="#e0ac69"/>
    <circle cx="0" cy="-88" r="32" fill="#e0ac69"/>
    <!-- cheek shading -->
    <path d="M14 -100 A32 32 0 0 1 14 -76 A20 20 0 0 0 14 -100 Z" fill="#c99456" opacity="0.5"/>

    <!-- ghutra (headscarf) + black agal band; same silhouette as the
         actual in-game sprite's headwear, just scaled up for the icon -->
    <path d="M-39 -104 L39 -104 L0 -142 Z" fill="#ffffff"/>
    <path d="M4 -104 L39 -104 L0 -142 Z" fill="#e6e6e6"/>
    <rect x="-39" y="-104" width="78" height="21" rx="6" fill="#ffffff"/>
    <path d="M4 -104 h35 v21 h-35 z" fill="#e6e6e6"/>
    <rect x="-39" y="-100" width="78" height="11" fill="#1a1a1a"/>
  </g>
</svg>
