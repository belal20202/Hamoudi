name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install web dependencies
        run: npm install

      - name: Type-check and build the offline web bundle (dist/)
        run: npm run build

      - name: Generate the Capacitor Android project
        run: npx cap add android

      - name: Sync the web build into the Android project
        run: npx cap sync android

      - name: Overlay zero-permission manifest & branding
        run: |
          set -e
          TEMPLATE="android-template/app/src/main"
          TARGET="android/app/src/main"

          cp "$TEMPLATE/AndroidManifest.xml" "$TARGET/AndroidManifest.xml"
          cp "$TEMPLATE/res/values/strings.xml" "$TARGET/res/values/strings.xml"
          cp "$TEMPLATE/res/values/colors.xml" "$TARGET/res/values/colors.xml"
          cp "$TEMPLATE/res/values/styles.xml" "$TARGET/res/values/styles.xml"
          cp "$TEMPLATE/java/com/belalalnuaimi/hamoudiadventures/MainActivity.java" \
             "$TARGET/java/com/belalalnuaimi/hamoudiadventures/MainActivity.java"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$TEMPLATE/res/mipmap-$density/ic_launcher.png" "$TARGET/res/mipmap-$density/ic_launcher.png"
            cp "$TEMPLATE/res/mipmap-$density/ic_launcher_round.png" "$TARGET/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (installable, unsigned — fine for sideloading/testing)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Check for release signing secrets
        id: check_secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release APK (only if keystore secret is configured)
        id: sign_apk
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamoudi-adventures-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APK artifact (if built)
        uses: actions/upload-artifact@v4
        if: steps.check_secrets.outputs.has_keystore == 'true'
        with:
          name: hamoudi-adventures-release-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          if-no-files-found: warn
