name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: mkdir -p assets && rsvg-convert -w 1024 -h 1024 resources/icon.svg -o assets/icon.png
      - run: npx cap add android
      - run: sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hamoudi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
