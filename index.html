<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0620" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="description" content="حمودي - رحلة البطل العربي. لعبة منصات ثنائية الأبعاد بأسلوب عربي أصيل." />
  <title>حمودي - رحلة البطل العربي</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0f0620;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: "Tahoma", "Segoe UI", "Geeza Pro", "Arial", sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #app {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: fixed; inset: 0;
    }
    canvas { touch-action: none; }
    #boot-fallback {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #f5c542;
      font-size: 20px; text-align: center; gap: 12px; z-index: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-fallback">
      <div>🕌 حمودي</div>
      <div style="font-size:14px;color:#cbb7ff;">جاري تحميل اللعبة...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
